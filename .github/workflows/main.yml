name: my-first workflow

# To get a trigger on every push in the repo in any branch
on: push

jobs:
  job1: 
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: Running single command line job1
       run: echo "Hi"
       
  job2:
     name: JOB2
     runs-on: ubuntu-latest
     steps:
      - name: hostname
        run: hostname
      - name: running multiple commands
        run: |
         echo "Hello"
         echo "Current data`date`"

  job3:
      name: JOB3
      needs: job1 # sequential 
      runs-on: ubuntu-latest
      steps:
        - name: testing
          run:   echo "jobThree"

  job4:
      name: JOB4
      needs: [job1,job2,job3]
      runs-on: ubuntu-latest
      steps:
        - name: sample Demo
          run: echo "jobFour"
      
