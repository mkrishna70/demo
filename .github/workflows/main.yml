name: my-first workflow

# To get a trigger on every push in the repo in any branch
on: 
 schedule:
   - cron: "5 * * * *"
 #workflow_dispatch:
 #push:

# * * * * * 
# * minute (0-59)
# * hour   (0-23)
# * day of the month (1-31)
# * month (1-12 or JAN -DEC)
# * DAY OF THE WEEK (0-6 or SUN-SAT)


jobs:
  job1: 
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: Running single command line job1
       run: echo "Hi"
       
  job2:
     name: JOB2
     runs-on: ubuntu-latest
     steps:
      - name: hostname
        run: hostname
      - name: running multiple commands
        run: |
         echo "Hello"
         echo "Current data`date`"

  job3:
      name: JOB3
      needs: job1 # sequential 
      runs-on: ubuntu-latest
      steps:
        - name: testing
          run:   echo "jobThree"

  job4:
      name: JOB4
      needs: [job1,job2,job3]
      runs-on: ubuntu-latest
      steps:
        - name: sample Demo
          run: echo "jobFour"
      
